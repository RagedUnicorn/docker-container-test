name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  docs-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check docs for hard-coded versions
        shell: bash
        run: |
          # The Dockerfile is the single, Renovate-managed source of the Container
          # Structure Test and Alpine versions. Concrete versions in the docs drift, so use
          # placeholders (<container-test-version>) or the symbolic X.Y.Z-alpineA.B.C-N form
          pattern='[0-9]+(\.[0-9]+)*-alpine[0-9]|alpine:[0-9]|--build-arg [A-Z_]*VERSION=[0-9]|ragedunicorn/[a-z0-9-]+:[0-9]'
          hits=$(git ls-files -z -- '*.md' | xargs -0 grep -HnE "$pattern" || true)
          if [ -n "$hits" ]; then
            while IFS=: read -r file line text; do
              echo "::error file=${file},line=${line},title=Hard-coded version::${text}"
            done <<< "$hits"
            exit 1
          fi
          echo "No hard-coded versions found in the docs"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Container Structure Test image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ragedunicorn/container-test:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=test

      - name: Capture build failure log
        # build-push-action exposes no error output, so rerun the build with
        # plain progress for the summary. The builder still holds the layers
        # up to the failing step, so only that step runs again.
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          docker buildx build --progress=plain --platform linux/amd64 \
            --build-arg VERSION=test . > build.log 2>&1 || true

      - name: Run File Structure Tests
        id: file-tests
        continue-on-error: true
        shell: bash
        run: |
          echo "::group::📁 File Structure Tests"
          CONTAINER_TEST_SELF_VERSION=test docker compose -f docker-compose.test.yml up --exit-code-from container-test container-test 2>&1 | tee test-file-structure.log
          echo "::endgroup::"

      - name: Run Command Execution Tests
        id: command-tests
        continue-on-error: true
        shell: bash
        run: |
          echo "::group::🔧 Command Execution Tests"
          CONTAINER_TEST_SELF_VERSION=test docker compose -f docker-compose.test.yml up --exit-code-from container-test-command container-test-command 2>&1 | tee test-command-execution.log
          echo "::endgroup::"

      - name: Run Metadata Tests
        id: metadata-tests
        continue-on-error: true
        shell: bash
        run: |
          echo "::group::🏷️ Metadata Tests"
          CONTAINER_TEST_SELF_VERSION=test docker compose -f docker-compose.test.yml up --exit-code-from container-test-metadata container-test-metadata 2>&1 | tee test-metadata.log
          echo "::endgroup::"

      - name: Test basic Container Structure Test functionality
        id: basic-tests
        continue-on-error: true
        shell: bash
        run: |
          echo "::group::🧪 Basic Container Structure Test Functionality"
          {
            echo "Testing Container Structure Test version..."
            docker run --rm --entrypoint container-structure-test ragedunicorn/container-test:test version
            echo ""
            echo "Testing with a real-world image (nginx:alpine)..."
            # container-structure-test reads --config from a file only, not stdin
            tmp=$(mktemp -d)
            chmod 755 "$tmp"
            printf 'schemaVersion: 2.0.0\ncommandTests:\n  - name: "nginx version"\n    command: "nginx"\n    args: ["-v"]\n    exitCode: 0\n' > "$tmp/nginx_test.yml"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$tmp":/config:ro \
              ragedunicorn/container-test:test \
              --pull --image nginx:alpine --config /config/nginx_test.yml
          } 2>&1 | tee test-basic-functionality.log
          echo "::endgroup::"

      - name: Generate Test Summary
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          FILE_OUTCOME: ${{ steps.file-tests.outcome }}
          COMMAND_OUTCOME: ${{ steps.command-tests.outcome }}
          METADATA_OUTCOME: ${{ steps.metadata-tests.outcome }}
          BASIC_OUTCOME: ${{ steps.basic-tests.outcome }}
        run: |
          # Strip ANSI colours and the docker compose "service-1  | " prefix
          clean() { sed -E 's/\x1b\[[0-9;]*m//g; s/^[a-z0-9_-]+-[0-9]+ +\| ?//' "$1"; }

          # Keep only the failing container-structure-test blocks plus the totals
          cst_failures() {
            clean "$1" | awk '
              /^=== RUN:/ { if (fail) printf "%s", blk; blk = $0 "\n"; fail = 0; inblk = 1; next }
              /^=====/ { if (fail) printf "%s", blk; blk = ""; fail = 0; inblk = 0; next }
              /^(Passes|Failures|Total tests):/ { tot = tot $0 "\n"; next }
              /^duration:/ { next }
              inblk { blk = blk $0 "\n"; if ($0 ~ /^--- FAIL/) fail = 1 }
              END { if (fail) printf "%s", blk; if (tot != "") printf "\n%s", tot }'
          }

          # Output of the build step that failed, from the plain-progress rerun
          build_failure() {
            local step
            step=$(grep -oE '^#[0-9]+ ERROR' build.log | head -n 1 | cut -d' ' -f1)
            if [ -n "$step" ]; then
              grep "^$step " build.log | tail -n 60
            else
              tail -n 60 build.log
            fi
          }

          # Failure output of one suite: extracted text, else the log tail
          excerpt() {
            local kind=$1 log=$2 text=""
            [ -f "$log" ] || return 0
            case "$kind" in
              cst) text=$(cst_failures "$log") ;;
              build) text=$(build_failure) ;;
            esac
            [ -n "$text" ] || text=$(clean "$log" | tail -n 60)
            printf '%s\n' "$text"
          }

          details() {
            local title=$1 body=$2 lines
            [ -n "$body" ] || return 0
            lines=$(printf '%s\n' "$body" | wc -l)
            echo "<details open><summary>❌ ${title} — failure output</summary>"
            echo ""
            echo '```text'
            printf '%s\n' "$body" | head -n 100
            if [ "$lines" -gt 100 ]; then
              echo "… $((lines - 100)) more lines, see the test-logs artifact"
            fi
            echo '```'
            echo ""
            echo "</details>"
            echo ""
          }

          status() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              skipped) echo "⏭️ Skipped" ;;
              cancelled) echo "🚫 Cancelled" ;;
              *) echo "❔ ${1:-Not run}" ;;
            esac
          }

          # name|outcome|excerpt kind|log file
          suites=(
            "🏗️ Image build|$BUILD_OUTCOME|build|build.log"
            "📁 File Structure|$FILE_OUTCOME|cst|test-file-structure.log"
            "🔧 Command Execution|$COMMAND_OUTCOME|cst|test-command-execution.log"
            "🏷️ Metadata|$METADATA_OUTCOME|cst|test-metadata.log"
            "🧪 Basic Functionality|$BASIC_OUTCOME|tail|test-basic-functionality.log"
          )

          failed=0
          {
            echo "## 📊 Test Results Summary"
            echo ""
            echo "| Test Suite | Status |"
            echo "|------------|--------|"
            for suite in "${suites[@]}"; do
              IFS='|' read -r name outcome _ _ <<< "$suite"
              echo "| ${name} | $(status "$outcome") |"
            done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          for suite in "${suites[@]}"; do
            IFS='|' read -r name outcome kind log <<< "$suite"
            [ "$outcome" == "failure" ] || continue
            failed=$((failed + 1))
            text=$(excerpt "$kind" "$log")
            details "$name" "$text" >> "$GITHUB_STEP_SUMMARY"
            # Surface the first error line as an annotation on the run page
            first=$(printf '%s\n' "$text" | grep -m 1 -E '^(Error|ERROR)|ERROR:' | sed -E 's/^#[0-9]+ ([0-9.]+ )?//' || true)
            # No error-looking line: fall back to the last line of the output
            [ -n "$first" ] || first=$(printf '%s\n' "$text" | grep -v '^[[:space:]]*$' | tail -n 1 || true)
            title=$(printf '%s' "$name" | sed -E 's/^[^A-Za-z]+//')
            echo "::error title=${title} failed::${first:-see the job summary}"
          done

          if [ "$BUILD_OUTCOME" != "success" ]; then
            echo "### ❌ Image build failed — test suites were skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "$failed" -gt 0 ]; then
            echo "### ❌ ${failed} test suite(s) failed — see the output above" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "$FILE_OUTCOME$COMMAND_OUTCOME$METADATA_OUTCOME$BASIC_OUTCOME" != "successsuccesssuccesssuccess" ]; then
            echo "### ❌ Some test suites did not run" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### ✅ All tests passed successfully!" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test logs
        if: always() && (steps.build.outcome == 'failure' || steps.file-tests.outcome == 'failure' || steps.command-tests.outcome == 'failure' || steps.metadata-tests.outcome == 'failure' || steps.basic-tests.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: |
            build.log
            test-file-structure.log
            test-command-execution.log
            test-metadata.log
            test-basic-functionality.log
          if-no-files-found: ignore
          retention-days: 7
